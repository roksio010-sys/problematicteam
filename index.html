<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <title>Problematic Team / архив команды 2022–2026</title>
  <meta name="description" content="Архив Problematic Team: любительские дубляжи и собственные мультсериалы, все серии в плеере.">
</head>
<body>
  <a class="skip" href="#projects" data-t="skip"></a>
  <header class="head" data-head="home"></header>
  <span hidden data-title="titleHome"></span>

  <main>
    <section class="hero hero--glow">
      <div class="hero__text">
        <span class="label label--accent rise" data-d="300" data-t="archiveLabel"></span>
        <h1 class="rise" data-d="420" data-t="heroH">МЫ&nbsp;—<br>PROBLEMATIC<br>TEAM</h1>
        <p class="lead rise" data-d="900" data-t="heroLead"></p>
        <div class="cta-row rise" data-d="1200">
          <a class="btn btn--line" href="#projects">
            <span class="btn__fill" aria-hidden="true"></span>
            <span class="btn__label" data-t="heroCta"></span>
            <svg class="btn__arrow" viewBox="0 0 34 10" fill="none" aria-hidden="true"><path d="M0 5h31M26.5 1 32 5l-5.5 4" stroke="currentColor" stroke-width="1.2"/></svg>
          </a>
        </div>
      </div>
      <aside class="hero__wall" aria-hidden="true">
        <img class="hero__logo" src="assets/pmt.png" alt="">
      </aside>
    </section>

    <section class="section wrap" id="about">
      <div class="statement">
        <div>
          <span class="label label--accent rise" data-t="aboutLabel"></span>
          <h2 class="rise" data-d="100" data-t="aboutH"></h2>
        </div>
        <p class="lead rise" data-d="200" data-t="aboutLong"></p>
      </div>
      <div class="why" data-why></div>
    </section>

    <section class="section wrap" id="projects">
      <div class="statement">
        <div>
          <span class="label label--accent rise" data-t="projectsLabel"></span>
          <h2 class="rise" data-d="100" data-t="projectsH"></h2>
        </div>
        <p class="lead rise" data-d="200" data-t="projectsLead"></p>
      </div>
      <div class="plist mt-l" data-plist></div>
    </section>

    <section class="section wrap" id="team">
      <div class="statement">
        <div>
          <span class="label label--accent rise" data-t="teamLabel"></span>
          <h2 class="rise" data-d="100" data-t="teamH"></h2>
        </div>
        <div>
          <p class="lead rise" data-d="200" data-t="teamLead"></p>
          <p class="label rise mt-s" data-d="280" data-t="teamNote"></p>
        </div>
      </div>
      <div class="team mt-l" data-team></div>
    </section>
  </main>

  <footer class="foot wrap" data-foot></footer>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
